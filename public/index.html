<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0C1E" />
  <title>Spaceman Math Quest — Permutasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-landing">
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>
  <div class="shooting-stars" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <main class="landing">
    <div class="landing__hero">
      <div class="astro astro--idle" id="heroAstro" aria-hidden="true">
        <picture>
          <source srcset="/assets/astro-stand.webp" type="image/webp" />
          <img class="astro__img" src="/assets/astro-stand.png" alt="" width="243" height="420" decoding="async" />
        </picture>
      </div>

      <h1 class="title" data-stagger>
        <span class="title__line">SPACEMAN</span>
        <span class="title__line title__line--accent">MATH QUEST</span>
      </h1>
      <p class="subtitle" data-stagger>Misi Permutasi — terbang setinggi mungkin.</p>
    </div>

    <section class="card glass card--form" data-stagger>
      <h2 class="card__title">Daftar Misi</h2>

      <form id="startForm" autocomplete="off" novalidate>
        <label class="field">
          <span class="field__label">Nama Lengkap</span>
          <input class="field__input" type="text" id="nama" name="nama" placeholder="cth. Rina Aulia" maxlength="40" required />
        </label>

        <label class="field">
          <span class="field__label">Nomor Absen</span>
          <input class="field__input" type="text" inputmode="numeric" id="absen" name="absen" placeholder="cth. 12" maxlength="6" required />
        </label>

        <p class="notice">
          <span class="notice__mark" aria-hidden="true"></span>
          <span><strong>Perhatian:</strong> Jangan keluar dari halaman ini, membuka aplikasi lain,
          atau membiarkan layar mati. Kamu akan <strong>langsung terkunci</strong> dan butuh izin admin.</span>
        </p>

        <button class="btn btn--primary" type="submit" id="startBtn">
          <span>Mulai Misi</span>
          <span class="btn__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
          </span>
        </button>

        <p class="form-error" id="formError" role="alert"></p>
      </form>
    </section>

    <a class="admin-link" href="/admin">Panel Admin</a>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/space.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
