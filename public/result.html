<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0C1E" />
  <title>Hasil Misi — Spaceman Math Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-result" data-sky="10">
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>
  <div class="confetti confetti--star" id="confetti" aria-hidden="true"></div>

  <main class="result">
    <section class="card glass result__hero">
      <p class="result__eyebrow" id="resNama">—</p>
      <div class="score-ring" id="scoreRing">
        <svg viewBox="0 0 120 120">
          <circle class="score-ring__bg" cx="60" cy="60" r="52"/>
          <circle class="score-ring__fg" id="scoreCircle" cx="60" cy="60" r="52"/>
        </svg>
        <div class="score-ring__value">
          <span class="score-ring__num" id="scoreValue">0</span>
          <span class="score-ring__cap">poin</span>
        </div>
      </div>
      <h1 class="result__title">Total Poin Misi</h1>
      <p class="result__streakline">COMBO terpanjang: <strong id="statStreak">0</strong> benar berturut-turut</p>
      <div class="result__stats">
        <div class="stat"><span class="stat__num" id="statBenar">0</span><span class="stat__label">Benar</span></div>
        <div class="stat"><span class="stat__num" id="statNilai">0</span><span class="stat__label">Nilai / 100</span></div>
        <div class="stat stat--wide"><span class="stat__num stat__num--sm" id="statLevel">Landasan</span><span class="stat__label">Posisi</span></div>
      </div>
    </section>

    <section class="card glass rumus-card">
      <h2 class="card__title">5 Rumus Utama Permutasi</h2>
      <ul class="rumus-list" id="rumusList"></ul>
    </section>

    <h2 class="review-title">Pembahasan Jawaban</h2>
    <section class="review" id="review"></section>

    <div class="result__actions">
      <a class="btn btn--ghost" href="/">Kembali ke Awal</a>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/space.js"></script>
  <script src="/js/hud.js"></script>
  <script src="/js/result.js"></script>
</body>
</html>
